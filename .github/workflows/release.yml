name: Release

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  read-manifest:
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.release_created == 'true'
    outputs:
      matrix: ${{ steps.platforms.outputs.matrix }}
      name: ${{ steps.name.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag_name }}

      - name: Get Platforms
        id: platforms
        run: |
          MATRIX=$(jq -c '{include: [.platforms[] | {os: .os, arch: .arch}]}' manifest.json)
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

      - name: Get App Name
        id: name
        run: |
          NAME=$(jq -r '.name | split("-plugin-")[1]' manifest.json)
          echo "name=$NAME" >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-latest
    needs:
      - read-manifest
      - release
    if: needs.release.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.read-manifest.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag_name }}

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          cache: true
          go-version: 'stable'

      - name: Prepare build variables
        id: vars
        run: |
          OS="${{ matrix.os }}"
          ARCH="${{ matrix.arch }}"
          EXT=""
          ARCHIVE="zip"

          if [ "$OS" = "macos" ]; then
            OS="darwin"
          fi

          if [ "$ARCH" = "x86" ]; then
            ARCH="386"
          fi

          if [ "$OS" = "windows" ]; then
            EXT=".exe"
          fi

          echo "GOOS=$OS" >> $GITHUB_ENV
          echo "GOARCH=$ARCH" >> $GITHUB_ENV
          echo "EXT=$EXT" >> $GITHUB_ENV
          echo "ARCHIVE=$ARCHIVE" >> $GITHUB_ENV

      - name: Build
        run: |
          mkdir -p build
          echo "Building for $GOOS-$GOARCH"

          GOOS=$GOOS \
          GOARCH=$GOARCH \
          CGO_ENABLED=0 \
          go build -o build/${{ needs.read-manifest.outputs.name }}-$GOOS-$GOARCH$EXT .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}
          path: build/${{ needs.read-manifest.outputs.name }}-*

  upload:
    runs-on: ubuntu-latest
    needs:
      - build
      - release
    if: needs.release.outputs.release_created == 'true'
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Upload to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.release.outputs.tag_name }} \
            dist/**/* \
            --repo ${{ github.repository }} \
            --clobber
